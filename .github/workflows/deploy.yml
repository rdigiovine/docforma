name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the dependencies
        run: |
          python -m pip install -r requirements.txt
      - name: Build the JupyterLite site
        run: |
          cp README.md content
          jupyter lite build --contents content --output-dir dist
      
      - name: Inject kernel status reporter
        run: |
          python - <<'EOF'
          from pathlib import Path

          script = """
          <script>
          (function () {
            if (parent === self) return;
          
            var TARGET = new URLSearchParams(location.search).get('parentOrigin') || '*';
            var SEL = '[data-jp-item-name="kernelStatus"]';
            var statusEl = null, sawBusy = false, timer = null, busyAt = 0;
          
            function send(state, extra) {
              var msg = { type: 'kernel', state: state };
              if (extra) for (var k in extra) msg[k] = extra[k];
              try { parent.postMessage(msg, TARGET); } catch (e) {}
            }
          
            function check() {
              if (!statusEl || !statusEl.isConnected) {
                statusEl = document.querySelector(SEL);
                if (!statusEl) return;
              }
              var svg = statusEl.querySelector('svg');
              var idle = (((svg && svg.dataset.icon) || '').indexOf('circle-empty') !== -1);
          
              if (!idle) {
                if (!sawBusy) { sawBusy = true; busyAt = Date.now(); send('busy'); }
                clearTimeout(timer);
              } else if (sawBusy) {
                clearTimeout(timer);
                timer = setTimeout(function () {
                  sawBusy = false;
                  send('idle', { durationMs: Date.now() - busyAt });
                }, 400);
              }
            }
          
            var tries = 0;
            var wait = setInterval(function () {
              statusEl = document.querySelector(SEL);
              if (!statusEl) {
                if (++tries > 600) {
                  clearInterval(wait);
                  send('error', { reason: 'status-item-not-found' });
                }
                return;
              }
              clearInterval(wait);
              send('ready');
              new MutationObserver(check).observe(
                document.getElementById('jp-main-statusbar') || document.body,
                { subtree: true, childList: true,
                  attributes: true, attributeFilter: ['data-icon', 'title'] }
              );
            }, 100);
          })();
          </script>
          """

          # targets = list(Path('dist').rglob('index.html'))
          targets = [p for p in Path('dist').rglob('index.html') if 'repl' in p.parts]
          print(f'Found {len(targets)} index.html files')
          for p in targets:
              html = p.read_text()
              if '</body>' in html:
                  p.write_text(html.replace('</body>', script + '</body>'))
                  print(f'  injected: {p}')
              else:
                  print(f'  SKIPPED (no body tag): {p}')
          EOF
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
