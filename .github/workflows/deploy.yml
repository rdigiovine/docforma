name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the dependencies
        run: |
          python -m pip install -r requirements.txt
      - name: Build the JupyterLite site
        run: |
          cp README.md content
          jupyter lite build --contents content --output-dir dist
      
      - name: Inject kernel status reporter
        run: |
          python - <<'EOF'
          from pathlib import Path

          script = """
          <script>
          (function () {
            if (parent === self) return;
            var sawBusy = false, timer = null;
            function check() {
              var el = document.querySelector('[data-jp-item-name="kernelStatus"]');
              if (!el) return;
              var svg = el.querySelector('svg');
              var icon = (svg && svg.dataset.icon) || '';
              var idle = icon.indexOf('circle-empty') !== -1;
              if (!idle) {
                sawBusy = true;
                clearTimeout(timer);
              } else if (sawBusy) {
                clearTimeout(timer);
                timer = setTimeout(function () {
                  sawBusy = false;
                  parent.postMessage({ type: 'kernel', state: 'idle' }, '*');
                }, 400);
              }
            }
            var wait = setInterval(function () {
              if (!document.querySelector('[data-jp-item-name="kernelStatus"]')) return;
              clearInterval(wait);
              parent.postMessage({ type: 'kernel', state: 'ready' }, '*');
              new MutationObserver(check).observe(document.body, {
                subtree: true, childList: true,
                attributes: true, attributeFilter: ['data-icon', 'title']
              });
            }, 100);
          })();
          </script>
          """

          targets = list(Path('dist').rglob('index.html'))
          print(f'Found {len(targets)} index.html files')
          for p in targets:
              html = p.read_text()
              if '</body>' in html:
                  p.write_text(html.replace('</body>', script + '</body>'))
                  print(f'  injected: {p}')
              else:
                  print(f'  SKIPPED (no body tag): {p}')
          EOF
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
